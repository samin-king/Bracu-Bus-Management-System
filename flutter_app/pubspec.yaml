name: bracu_transport
description: Member 3 transport and driver frontend for the existing BRACU APIs.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'
dependencies:
  flutter:
    sdk: flutter
  cookie_jar: ^4.0.9
  dio: ^5.9.0
  flutter_secure_storage: ^11.2.0
  flutter_web_auth_2: ^5.1.0
dev_dependencies:
  http: ^1.2.2 # Legacy transport test fixtures only; production uses shared Dio.
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
