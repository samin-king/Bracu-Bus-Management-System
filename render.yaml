# Temporary demo deployment. Keep the repository root as Render's Root Directory.
services:
  - type: web
    name: bracu-transport-api
    runtime: node
    branch: main
    plan: free
    autoDeployTrigger: off
    buildCommand: npm ci --omit=dev --workspace services --workspace server
    startCommand: npm run migrate && node services/scripts/seed-demo.js && npm run start --workspace services
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://bracu-bus-management-system.vercel.app
      - key: GOOGLE_CALLBACK_URL
        value: https://bracu-bus-management-system.vercel.app/api/auth/google/callback
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: DEV_DIRECT_LOGIN
        value: "false"
      - key: DEV_EMAIL_LOGIN
        value: "false"
      - key: ENABLE_DEV_DRIVER_AUTH
        value: "false"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: DEMO_STUDENT_EMAIL
        sync: false
      - key: DEMO_DRIVER_EMAIL
        sync: false
      - key: DEMO_AUTHORITY_EMAIL
        sync: false
